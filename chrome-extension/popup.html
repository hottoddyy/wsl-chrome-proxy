<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>WSL Proxy</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>WSL Proxy</h1>
        <label class="switch" title="Toggle Chrome proxy">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <p class="target">HTTP 127.0.0.1:18080</p>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
